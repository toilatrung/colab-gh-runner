# Bộ đếm giờ dự phòng cho cron-job.org: gọi /api/check trên Vercel định kỳ.
# Lưu ý: schedule của GitHub có thể trễ vài phút (và bị bỏ qua khi tải cao) – dùng cron-job.org làm chính.
# Cần Repository secrets: CHECK_SECRET, và VERCEL_APP_URL (vd https://ten-app.vercel.app).
# Workflow này chạy trên ubuntu-latest (runner của GitHub), KHÔNG chiếm runner Colab.
name: colab-watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gọi /api/check
        env:
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          if [ -z "$CHECK_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "Thiếu secret CHECK_SECRET hoặc VERCEL_APP_URL"; exit 1
          fi
          curl -fsS --retry 2 --max-time 25 \
            -H "Authorization: Bearer $CHECK_SECRET" \
            "${APP_URL%/}/api/check"
          echo
