name: CI on Colab runner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: colab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Job sẽ nằm "Queued" cho tới khi runner Colab online.
    # Webapp local (only_when_queued) sẽ thấy job chờ và tự khởi động phiên Colab.
    runs-on: [self-hosted, colab]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Thông tin máy Colab
        run: |
          nproc; free -h; df -h /content || true
          nvidia-smi || echo "Không có GPU"

      - name: Cài dependencies
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "No tests"; fi

  gpu-train:
    # Chỉ chạy khi runner có nhãn gpu (notebook tự gắn nếu runtime có GPU)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: [self-hosted, colab, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))"
